<router-outlet></router-outlet>

<!-- CAMPANA GLOBAL — visible en todos los módulos -->
<div class="campana-global" *ngIf="usuarioLogueado">
  <button class="campana-btn" (click)="toggleNotif($event)">
    <i class="bi bi-bell-fill"></i>
    <span class="campana-badge" *ngIf="notificaciones.length > 0">
      {{ notificaciones.length }}
    </span>
  </button>
</div>

<!-- PANEL FLOTANTE -->
<div class="notif-panel-flotante" *ngIf="mostrarNotificaciones">
  <div class="notif-panel-header">
    <span>🔔 Notificaciones</span>
    <button class="notif-limpiar" (click)="limpiarNotificaciones()">Limpiar</button>
  </div>
  <div *ngIf="notificaciones.length === 0" class="notif-empty">
    <i class="bi bi-bell-slash"></i>
    <span>No hay notificaciones por el momento</span>
  </div>
  <div *ngFor="let n of notificaciones"
    class="notif-item"
    [class.notif-vivo]="n.tipo === 'vivo'"
    [class.notif-programado]="n.tipo === 'programado'"
    [class.notif-actualizado]="n.tipo === 'actualizado'"
    (click)="abrirNotif(n)">
    <div class="notif-titulo">{{ n.titulo }}</div>
    <div class="notif-msg">{{ n.mensaje }}</div>
  </div>
</div>

<!-- MODAL DE NOTIFICACIÓN -->
<div class="notif-modal-overlay" *ngIf="notifActiva" (click)="cerrarModal()">
  <div class="notif-modal"
    [class.modal-vivo]="notifActiva.tipo === 'vivo'"
    [class.modal-programado]="notifActiva.tipo === 'programado'"
    [class.modal-actualizado]="notifActiva.tipo === 'actualizado'"
    (click)="$event.stopPropagation()">
    <div class="notif-modal-icon">
      <span *ngIf="notifActiva.tipo === 'vivo'">⚽</span>
      <span *ngIf="notifActiva.tipo === 'programado'">📅</span>
      <span *ngIf="notifActiva.tipo === 'actualizado'">✏️</span>
    </div>
    <h3 class="notif-modal-titulo">{{ notifActiva.titulo }}</h3>
    <p class="notif-modal-detalle">{{ notifActiva.detalle }}</p>
    <div class="notif-modal-acciones">
      <button class="btn-modal-ir" (click)="irDesdeModal()">
        {{ notifActiva.btnTexto }}
        <i class="bi bi-arrow-right-short"></i>
      </button>
      <button class="btn-modal-cerrar" (click)="cerrarModal()">Cerrar</button>
    </div>
  </div>
</div>
